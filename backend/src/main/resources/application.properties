# GreenPulse Spring Boot Configuration
spring.application.name=greenpulse-backend
server.port=${PORT:8080}

# Environment / Database Configuration (H2 Default, MySQL Override)
spring.datasource.url=${DB_URL:jdbc:h2:mem:greenpulsedb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}

# JPA & Hibernate Configuration
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Database Initialization (Loads schema & seed)
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/seed.sql

# H2 Console (Development Mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Multipart File Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Security Properties
greenpulse.jwt.secret=${JWT_SECRET:9a2f8c4e7b1d6f3a8e5c2b0d9f4e7a1c3b5d8e0f2a4c6b8d1e3f5a7c9b0d2e4f}
greenpulse.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Storage Config
greenpulse.upload.dir=${UPLOAD_DIR:uploads}
