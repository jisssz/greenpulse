# GreenPulse Spring Boot Configuration
spring.application.name=greenpulse-backend
server.port=${PORT:8080}

# Environment / Database Configuration (H2 Default, MySQL Autodetect on DB_URL override)
spring.datasource.url=${DB_URL:jdbc:h2:mem:greenpulsedb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}

# HikariCP Connection Pool Production Timeouts
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Database Initialization (Embedded H2 only, disabled for production DB)
spring.sql.init.mode=${SQL_INIT_MODE:embedded}

# H2 Console (Development Mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Multipart File Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Security Properties
greenpulse.jwt.secret=${JWT_SECRET:9a2f8c4e7b1d6f3a8e5c2b0d9f4e7a1c3b5d8e0f2a4c6b8d1e3f5a7c9b0d2e4f}
greenpulse.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Storage Config
greenpulse.upload.dir=${UPLOAD_DIR:uploads}

# AI Service Config
greenpulse.ai.service.url=${GREENPULSE_AI_SERVICE_URL:http://localhost:8000}

